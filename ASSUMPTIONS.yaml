  - id: ASM-03
    parameter: "Cooling capacity outside [12 °C, 30 °C] seawater interval"
    unit: "W (derived from kW)"
    concretized_values: "For T < 12 °C, clamp C(T) conservatively to 160,000 W. For T > 30 °C, fail-closed policy flags OUT_OF_ENVELOPE_HIGH_TEMP and applies linear penalty clamped at >= 0 W."
    justification: "Annex A.2: C(T)=160-40*(T-12)/18 kW in [12, 30] °C; out-of-range values handled by documented conservative policy."
    code_references:
      - "src/sdv_governor/budgets.py"
      - "data/ship/vessel_baseline.yaml"

  - id: ASM-04
    parameter: "Mast air cooling vs chilled-water loop accounting and hangar_roof placement"
    unit: "W, kg, m2"
    concretized_values: "Mast positions have no chilled-water manifold and rely on local air cooling capped at 2,000 W per position. G5's 25 kg antenna can mount on mast_3 (x3.0 stability) or hangar_roof (x1.2 stability) with separate air cooling domains (mast_3 and hangar_roof); when mounted on hangar_roof with G4 installed, explicit drone clearance verification is required."
    justification: "Annex A.3 and Annex B G5 card: antenna 0.3 m2, 25 kg at free mast slot or hangar roof (x1.2, check drone clearance)."
    code_references:
      - "src/sdv_governor/budgets.py"
      - "src/sdv_governor/placement.py"
      - "src/sdv_governor/admission.py"

  - id: ASM-05
    parameter: "Compute rack accelerator indivisibility and 80% allocatable pool"
    unit: "nodes (4), cores_per_node (32 total, 25 allocatable), ram_mib_per_node (102,400 MiB), accelerators (1 physical per node, max 3 across cluster)"
    concretized_values: "Each of the 4 rack nodes has 32 cores, 128 GiB RAM, and 1 physical accelerator. Applying the 80% allocatable rule strictly without fractional physical accelerators: 25 cores/node, 102,400 MiB RAM/node, 16,000 GB shared storage, and at most 3 of 4 physical accelerators across the cluster."
    justification: "Annex A.7: 4 nodes, 32 cores/128 GB/1 accelerator each, 20 TB shared, 80% allocatable."
    code_references:
      - "src/sdv_governor/budgets.py"
      - "data/ship/vessel_baseline.yaml"

  - id: ASM-06
    parameter: "Scenario B candidate evaluation, losing-mission cost formula, and separate G4 touchdown vs 20-min charging"
    unit: "seconds, minutes, utility points"
    concretized_values: "In Scenario B (D3), G4 recovery separates the operational flight-deck approach/touchdown phase (which must complete before the 12-min / 720 s battery deadline at t=1200 s) from the subsequent 20-min (1200 s) 35 kW hangar charging phase, followed by 10 kW post-charge operation or 2 kW standby."
    justification: "Touchdown occurs within the 720 s battery emergency deadline after acoustic HOLD confirmation and ship turn into wind, before the 1200 s high-power charging cycle."
    code_references:
      - "src/sdv_governor/arbitration.py"
      - "src/sdv_governor/replay.py"

  - id: ASM-07
    parameter: "Scenario B 4-guest (G1+G3+G4+G5) minute-12 generator loss (200 kW -> 100 kW) vs 3-guest 105 kW unit fixture"
    unit: "W"
    concretized_values: "Per organizer clarification GRAZIANO_B_COMPOSITION_0855 (data/overrides/organizer_clarifications.yaml), official Scenario B installs 4 guests: G1 (1.5 kW on mast_3, LINE_A_FWD) + G3 (1 kW survey with 25 kW firm recharge reserve in bay1, LINE_A_FWD) + G4 (10 kW patrol / 35 kW recovery-charge in hangar, LINE_B_AFT) + G5 (45 kW full / 8 kW degraded in bay2 + hangar_roof, LINE_B_AFT). At t=0 actual=57.5 kW, committed=81.5 kW; with G4 35 kW reserved/active, committed=106.5 kW (> 100 kW generator-loss reserve) and actual=57.5 kW or 82.5 kW; throttling G5 to 8 kW lowers committed to 69.5 kW (<= 100 kW) and water committed to 67.5 kW (<= 72 kW at 30 °C degraded loop). Separately, scenario_B_charging_deficit_105kw is retained as an isolated 3-guest (G3+G4+G5) UNIT_FIXTURE where G3 actively charges at 25 kW for 105 kW instantaneous load."
    justification: "Reconciles official 4-guest Scenario B (106.5 kW committed -> 69.5 kW throttled) with the isolated 3-guest 105 kW active-charging unit test fixture."
    code_references:
      - "data/overrides/organizer_clarifications.yaml"
      - "src/sdv_governor/degradation.py"
      - "data/scenarios/scenario_B_arbitration_degradation.yaml"
      - "data/scenarios/scenario_B_cooling_limited_30c.yaml"
      - "data/scenarios/scenario_B_charging_deficit_105kw.yaml"

  - id: ASM-ROOF-G4-CLEARANCE
    parameter: "Conditional geometric compatibility of G5 antenna on hangar_roof with G4 VTOL operations"
    unit: "discrete installation zone policy (ROOF_OUTSIDE_G4_RECOVERY_V1)"
    concretized_values: "Policy ROOF_OUTSIDE_G4_RECOVERY_V1 (version 1, layout VESSEL_BASELINE_LAYOUT_V1) models hangar_roof antenna mounting in zone ROOF_ANTENNA_OUTSIDE_RECOVERY_ENVELOPE outside excluded zones G4_ROTOR_DISC and G4_RECOVERY_CORRIDOR. Requires explicit installation verification tied to policy_id, layout_version, and component IDs; invalidated by ANTENNA_RELOCATION, G4_ENVELOPE_CHANGE, or LAYOUT_VERSION_CHANGE."
    justification: "Annex B G5 card notes 'hangar roof (x1.2, check drone clearance)' and organizer clarification GRAZIANO_ROOF_AND_G4_MASS_0904 states the team must declare the assumption and enforce it in manifest, placement, admission, and runtime."
    code_references:
      - "data/ship/vessel_baseline.yaml"
      - "data/overrides/organizer_clarifications.yaml"
      - "src/sdv_governor/placement.py"
      - "src/sdv_governor/admission.py"
      - "src/sdv_governor/budgets.py"

  - id: ASM-ROOF-AIR-2000W
    parameter: "Local air-cooling domain capacity on hangar_roof"
    unit: "W (2000 W)"
    concretized_values: "Defines hangar_roof as an independent local ambient/air cooling domain with capacity_w = 2000 W (value_origin: ASSUMED), physically separate from the mast_3 air cooling domain (capacity_w = 2000 W, value_origin: OFFICIAL_BRIEF). Loads on mast_3 (G1: 1500 W) and hangar_roof (G5 antenna: 1200 W) are checked against their respective 2000 W local domain limits rather than pooled into a single 2000 W or 4000 W bucket."
    justification: "Annex A.2/A.3 specifies 2 kW air cooling per mast position and allows G5's air-cooled antenna on hangar_roof; separating mast_3 and hangar_roof domains prevents false cross-location collisions while keeping roof capacity configurable."
    code_references:
      - "data/ship/vessel_baseline.yaml"
      - "src/sdv_governor/budgets.py"

  - id: ASM-G5-COMPONENT-POWER-SPLIT
    parameter: "G5 subcomponent electrical power and thermal domain split between container and antenna"
    unit: "W"
    concretized_values: "In FULL_SPECTRUM (45,000 W total): G5_COMPUTE_CONTAINER draws 43,800 W electrical / 43,800 W chilled water, and G5_MAST_ANTENNA draws 1,200 W electrical / 1,200 W local air. In DEGRADED_70PCT_LOSS (8,000 W total): G5_COMPUTE_CONTAINER draws 7,500 W electrical / 7,500 W water, and G5_MAST_ANTENNA draws 500 W electrical / 500 W air. In STANDBY (2,000 W nominal, 2,500 W peak): G5_COMPUTE_CONTAINER draws 2,000 W nominal (2,500 W peak) / 2,000 W water, and G5_MAST_ANTENNA draws 0 W. When +20% perturbation (+9,000 W) is applied to G5 FULL_SPECTRUM, the 9,000 W compute overload is attributed once to G5_COMPUTE_CONTAINER (52,800 W water + 1,200 W air = 54,000 W total)."
    justification: "Routes each G5 subcomponent's electrical draw and heat rejection to the feeder line and thermal domain of its actual placement (bay2 -> LINE_B_AFT/water; hangar_roof -> LINE_B_AFT/roof-air or mast_3 -> LINE_A_FWD/mast-air) while strictly conserving energy 1:1."
    code_references:
      - "data/guests/G5_emergency_comms_edge.yaml"
      - "src/sdv_governor/budgets.py"
      - "src/sdv_governor/manifest.py"

  - id: ASM-G4-STATION-POWER-ACCOUNTING
    parameter: "G4 subcomponent electrical and chilled-water attribution to G4_HANGAR_STATION"
    unit: "W"
    concretized_values: "Across LAUNCH_RECOVERY_OPTICS (35,000 W), FLIGHT_PATROL (10,000 W), and STANDBY (2,000 W), 100% of G4 shipboard electrical draw and chilled-water heat rejection is attributed to G4_HANGAR_STATION in hangar (LINE_B_AFT, CHILLED_WATER_LOOP), while G4_DRONE_VEHICLE draws 0 W from ship feeders."
    justification: "The airframe operates on internal battery in flight and charges/operates optical recovery gear through the hangar station on LINE_B_AFT."
    code_references:
      - "data/guests/G4_uav_sar.yaml"
      - "src/sdv_governor/budgets.py"
      - "src/sdv_governor/manifest.py"

  - id: ASM-A6-INTRABAND-SPEED-3-TO-5KN
    parameter: "Annex A.6 causal transition timing policy and 3 -> 5 kn intra-band recovery speed adjustment"
    unit: "kn (5.0 kn target), s (60 s intra-band, 90 s course settle, 180 s inter-band/quiet, 240/600 s deck clear, 30/120 s human confirm, 780 s generator restart)"
    concretized_values: "Sets G4 recovery target ship speed to 5.0 kn (within G4's 5-12 kn operational envelope and Annex A.6's 3-5 kn slow survey speed band), modeling the 3 -> 5 kn adjustment as a 60 s intra-band transition. Formalizes Annex A.6 reference durations in data/ship/transition_timing_policy.yaml and forbids at-sea cooling loop repair."
    justification: "Annex A.6 defines speed bands (3-5, 10-14, 18-25 kn) and inter-band transition times (2-5 min/band) without quantifying intra-band speed adjustments; 5.0 kn with 60 s intra-band settle avoids unmodeled speed gaps and instantaneous state jumps."
    code_references:
      - "data/ship/transition_timing_policy.yaml"
      - "src/sdv_governor/arbitration.py"
      - "src/sdv_governor/replay.py"
      - "src/sdv_governor/ship_state.py"

  - id: ASM-ENV-UNITS
    parameter: "Meteorological and oceanographic unit conversions (m/s -> kn, m, deg C)"
    unit: "kn = m/s * 1.943844; m; deg C"
    concretized_values: "Converts NOAA NDBC wind speeds and gusts from m/s to knots using exact conversion factor 1.943844. Retains seawater temperature in degrees Celsius (deg C) and wave heights (significant wave height Hs) in meters."
    justification: "NDBC buoys publish raw observations in SI units (m/s), whereas naval vessel operational envelopes and guest cards express limits in knots (kn)."
    code_references:
      - "tools/fetch_public_env.py"
      - "src/sdv_governor/envdata.py"

  - id: ASM-ENV-SEASTATE-WMO3700
    parameter: "Conversion from significant wave height (Hs) to WMO Code Table 3700 sea state scale"
    unit: "discrete code 0-9"
    concretized_values: "Maps significant wave height Hs (m) to discrete sea state code using WMO 3700 upper-inclusive thresholds: 0 (0 m), 1 (<= 0.1 m), 2 (<= 0.5 m), 3 (<= 1.25 m), 4 (<= 2.5 m), 5 (<= 4.0 m), 6 (<= 6.0 m), 7 (<= 9.0 m), 8 (<= 14.0 m), 9 (> 14.0 m). Sea state is always derived freshly from interpolated Hs, never linearly interpolated across discrete codes."
    justification: "Ship operational envelopes and candidate guest cards restrict launch/recovery by discrete sea state codes. Deriving sea state directly from physical Hs preserves physical validity and avoids fractional or jump artifacts."
    code_references:
      - "src/sdv_governor/envdata.py"

  - id: ASM-ENV-INTERP
    parameter: "Linear temporal interpolation of hourly metocean series to 1 Hz simulation resolution"
    unit: "1 Hz (1 s time step)"
    concretized_values: "Performs continuous linear interpolation between adjacent hourly public snapshot records for sea surface temperature (SST), sustained wind speed, wind gust, and wave height (Hs). Derived discrete metrics (sea state) are evaluated from the interpolated continuous values at every second."
    justification: "Public coastal model forecasts and buoy feeds report at 1-hour resolution, while the SDV Governor execution and telemetry clock operate at 1 Hz."
    code_references:
      - "src/sdv_governor/envdata.py"

  - id: ASM-ENV-WIND-SUSTAINED
    parameter: "10-meter sustained wind velocity convention for operational envelope checks"
    unit: "kn (knots)"
    concretized_values: "The operational wind constraint (wind_kn) evaluates against 10-meter sustained wind speed (wind_speed_10m). Peak wind gusts (wind_gusts_10m) are reported as advisory alerts and integrated into empirical guard bands rather than directly tripping sustained limits."
    justification: "Naval envelope cards define operational ceilings (e.g. 25 kn, 35 kn) in terms of sustained maritime wind, while transient gusts are accommodated via empirical safety guard bands."
    code_references:
      - "src/sdv_governor/envdata.py"
      - "src/sdv_governor/env_windows.py"

  - id: ASM-ENV-WIND-INT
    parameter: "Integer casting and rounding of wind speed in ship operational state"
    unit: "kn (integer)"
    concretized_values: "ShipOperationalState defines wind_kn as an integer. Guard bands and gust allowances are applied to the continuous floating-point wind value before final integer rounding (round-half-up), guaranteeing that fractional safety margins are never truncated."
    justification: "Maintains backward compatibility with integer-typed ShipOperationalState while preventing optimistic rounding errors."
    code_references:
      - "src/sdv_governor/envdata.py"
      - "src/sdv_governor/ship_state.py"

  - id: ASM-ENV-VALIDITY
    parameter: "Maximum forward validity horizon of public metocean coastal forecast"
    unit: "hours (lead <= 48 h)"
    concretized_values: "Metocean forecast outlook queries are restricted to a maximum lead time of 48 hours from the snapshot issue timestamp (issue_utc). Inquiries beyond 48 hours are rejected as UNAVAILABLE."
    justification: "Coastal mesoscale atmospheric and ocean wave models exhibit rapidly declining skill beyond 48 hours; a strict fail-closed cutoff prevents ungrounded operational commitments."
    code_references:
      - "src/sdv_governor/envdata.py"

  - id: ASM-ENV-TTL
    parameter: "Environmental feed time-to-live (TTL) and stale fallback in live replay"
    unit: "ms (5,400,000 ms = 90 min)"
    concretized_values: "Feed readings carry a time-to-live of 5,400,000 ms (90 minutes, corresponding to the 1-hour public sampling interval plus a 30-minute grace window). If no fresh feed update is delivered before expiration, the governor transitions to STALE and falls back to the worst-case 30 deg C seawater baseline."
    justification: "Prevents reliance on obsolete maritime conditions and preserves safety-critical conservative defaults."
    code_references:
      - "src/sdv_governor/envdata.py"
      - "src/sdv_governor/replay.py"

  - id: ASM-ENV-ANCHOR
    parameter: "Scenario time-zero anchor mapping to absolute UTC timestamp"
    unit: "ISO 8601 UTC timestamp string"
    concretized_values: "Simulation time sim_time_s = 0 is anchored to an explicit absolute UTC timestamp (anchor_utc) defined in the scenario. Operational logs and advisory sentences format elapsed time as T+s accompanied by absolute UTC time in parentheses."
    justification: "Enables reproducible synchronization between relative simulation seconds and historical public weather records."
    code_references:
      - "src/sdv_governor/envdata.py"
      - "src/sdv_governor/scenarios.py"

  - id: ASM-ENV-POINT
    parameter: "Representative geographic point for vessel operating area (Golden Gate Bar)"
    unit: "WGS84 decimal degrees (lat 37.788, lon -122.634)"
    concretized_values: "Models vessel operations at geographic point GG_BAR (Golden Gate Bar, seaward of the Golden Gate Bridge), co-located with NOAA NDBC buoy 46237. Spatial advection between grid cells is not modeled."
    justification: "Open-Meteo Marine operates on an ~8 km coastal grid that lacks skill inside San Francisco Bay; anchoring at GG_BAR provides deep-water marine model data directly verifiable against physical buoy 46237."
    code_references:
      - "tools/fetch_public_env.py"
      - "src/sdv_governor/envdata.py"

  - id: ASM-ENV-SPEED-ASSUMED
    parameter: "Assumed ship speed for advisory operational window searching"
    unit: "kn (knots)"
    concretized_values: "When calculating future operational windows for candidate guests without an active navigation plan, the vessel speed is assumed to be the midpoint of the candidate guest's allowable speed envelope."
    justification: "Enables advisory feasibility evaluation over future forecast hours without fabricating unverified voyage plans."
    code_references:
      - "src/sdv_governor/env_windows.py"

  - id: ASM-ENV-MINWIN
    parameter: "Default minimum required operational window duration"
    unit: "s (1800 s = 30 min default)"
    concretized_values: "Advisory window searches enforce a default continuous feasible duration of 1800 s (30 min), unless overridden by specific guest operation cards (e.g. G4 recovery = 900 s, G4 charging = 1200 s)."
    justification: "Prevents short transient weather calms from being declared viable when marine evolutions require sustained safe execution."
    code_references:
      - "src/sdv_governor/env_windows.py"

  - id: ASM-ENV-GUARD-DEFAULT
    parameter: "Conservative fallback guard bands for insufficient validation pairs"
    unit: "wind +5 kn, wave_hs +0.5 m, SST +1.0 deg C"
    concretized_values: "If backtesting between Open-Meteo model data and NDBC observations yields fewer than 72 valid pairs (3 days), conservative default guard bands of +5 kn (wind), +0.5 m (Hs), and +1.0 deg C (SST) are applied and flagged as INSUFFICIENT_PAIRS."
    justification: "Fail-closed safety policy guarantees that uncalibrated model uncertainty widens protective margins rather than permitting optimistic admissions."
    code_references:
      - "tools/backtest_public_env.py"
      - "src/sdv_governor/envdata.py"

  - id: ASM-FCST-WARMUP
    parameter: "Initial warmup filter duration for Holt-Winters predictive observer"
    unit: "samples / s (20 valid 1 Hz samples = 20 s)"
    concretized_values: "Filter state initializes with level l_0 = z_0 and trend b_0 = 0. During the first 20 valid 1 Hz samples, observer status is WARMUP and all advisory overrun warnings are suppressed."
    justification: "Prevents false-alarm spikes while the recursive exponential smoothing filters initialize and stabilize."
    code_references:
      - "src/sdv_governor/forecast/holt.py"
      - "src/sdv_governor/forecast/observer.py"

  - id: ASM-FCST-MODE-RESET
    parameter: "State reset of Holt forecaster upon guest operational mode transition"
    unit: "s (20 s reset warmup)"
    concretized_values: "Upon an operational mode change reported by the governor, the forecaster resets its state to current measured power (l = z_t, b = 0) and enters a 20 s WARMUP phase."
    justification: "Mode switches cause intentional discrete step changes in electrical and thermal demand; resetting trend prevents old mode inertia from distorting the new operational regime."
    code_references:
      - "src/sdv_governor/forecast/holt.py"
      - "src/sdv_governor/forecast/observer.py"

  - id: ASM-FCST-STALE
    parameter: "Telemetry gap handling and conformal band inflation for brief dropouts"
    unit: "s (telemetry gap > 3 s and <= 10 s)"
    concretized_values: "If guest telemetry is interrupted for more than 3 s (up to 10 s), observer status transitions to STALE, conformal prediction bands are inflated by a factor of 1.5x, and new advisory alarms are inhibited."
    justification: "Temporary telemetry dropouts increase estimation variance; inflating uncertainty bounds reflects reduced confidence without triggering spurious alarms."
    code_references:
      - "src/sdv_governor/forecast/observer.py"

  - id: ASM-FCST-UNAVAIL
    parameter: "Telemetry loss disconnect and forecast suppression after prolonged gap"
    unit: "s (telemetry gap > 10 s)"
    concretized_values: "If no valid telemetry sample is received for more than 10 s, forecaster status transitions to UNAVAILABLE, forecasts are suppressed, and the system reports 'no reliable forecast'."
    justification: "Extrapolating high-rate time-series projections past 10 seconds of missing observations is ungrounded and unsafe."
    code_references:
      - "src/sdv_governor/forecast/observer.py"

  - id: ASM-FCST-REGIME
    parameter: "Unannounced regime break detection and fast re-adaptation"
    unit: "samples / sigma (3 consecutive samples > 4 * sigma_ewm; 10 s short warmup)"
    concretized_values: "If one-step prediction residuals satisfy |z_t - z_hat_{t|t-1}| > 4 * sigma_ewm across 3 consecutive samples, a REGIME_BREAK is declared, triggering an immediate trend reset and a short 10 s warmup."
    justification: "Detects unannounced hardware anomalies or unscheduled subcomponent activations, adapting rapidly rather than slowly dragging lagging trends."
    code_references:
      - "src/sdv_governor/forecast/holt.py"
      - "src/sdv_governor/forecast/observer.py"

  - id: ASM-FCST-OVERRUN-THRESHOLD
    parameter: "Percentage threshold for advisory overconsumption early warning"
    unit: "ratio (1.10 = 110% of declared power)"
    concretized_values: "An advisory warning is emitted when projected upper conformal bound y_hi(h) exceeds 1.10 * declared_w. (Distinguished from reactive degradation handler which acts on measured > declared)."
    justification: "Setting an explicit 110% advisory threshold filters normal sensor noise and transient ripple, ensuring advisory alerts provide high-confidence early warnings."
    code_references:
      - "src/sdv_governor/forecast/advisory.py"
      - "src/sdv_governor/forecast/params.py"

  - id: ASM-FCST-CACHE
    parameter: "Physical budget projection and bisection solver memoization"
    unit: "ratio (1% = 0.01 relative change threshold)"
    concretized_values: "Full 8-class budget re-evaluations and bisection searches are skipped if the upper forecast bound y_hi has not shifted by more than 1% since the previous evaluation."
    justification: "Restricts per-tick forecast overhead on embedded hardware (Arduino Ventuno Q) to well under 10 ms."
    code_references:
      - "src/sdv_governor/forecast/projector.py"

  - id: ASM-FCST-SYNTHETIC-TELEMETRY
    parameter: "Declared deterministic synthetic guest telemetry generation"
    unit: "W (1 Hz, seeded PRNG)"
    concretized_values: "Guest power telemetry is synthesized at 1 Hz using Python stdlib random.Random(seed) anchored to declared mode nominal power, card-specified peak envelopes, and explicit perturbation profiles. Explicitly labeled SIMULATED; purely advisory; zero influence on governor decisions."
    justification: "Real high-rate sub-second per-guest naval telemetry is unavailable in hackathon conditions; deterministic declared synthetic telemetry provides reproducible validation without misrepresenting simulated traces as field measurements."
    code_references:
      - "src/sdv_governor/forecast/telemetry.py"

  - id: SINGLE_GENSET_LOSS_WINDOW
    parameter: "Envelope window that represents the loss of one generator (Scenario A: 'holds with one genset down')"
    unit: "window_id"
    concretized_values: "DEGRADED_GEN_LOSS_100KW_30C (reserve 200 kW -> 100 kW, 30 C water), flagged in data/ship/mission_envelope_a10.yaml with represents: SINGLE_GENSET_LOSS; detection is by flag, never by window name. The envelope fails closed if no such window exists."
    provenance: "DERIVED"
    justification: "Scenario B min 12 reserves ~100 kW after one generator trips; Scenario A asks explicitly whether the verdict holds in that state."
    code_references:
      - "src/sdv_governor/admission.py::evaluate_mission_envelope_a10"
      - "src/sdv_governor/manifest.py::validate_mission_envelope"
    test: "tests/unit/test_ch_c5_one_genset_down.py"

  - id: OWN_RADAR_ON_AT_SEA
    parameter: "Own ship radar transmits whenever the vessel is at sea (not in port, not under EMCON silence, not under QUIET_RADIO)"
    unit: "boolean policy"
    concretized_values: "true by default (own_radar_policy TRANSMIT); G1 radar_tx_degradation_ratio 0.30 (official Annex B G1 'RADAR_DEGRADED_30PCT') applies to G1 on exposed positions."
    provenance: "ASSUMED"
    justification: "Annex B says G1 loses 30% when the ship radar is transmitting nearby; navigation at sea requires the radar, so transmission is the safe default."
    code_references:
      - "src/sdv_governor/capability_effects.py::own_radar_transmitting"
    test: "tests/unit/test_ch_c6_own_radar.py"

  - id: OWN_RADAR_EXPOSED_POSITIONS
    parameter: "Positions affected by own-radar transmission"
    unit: "position names"
    concretized_values: "mast_1, mast_2, mast_3, hangar_roof (data/ship/vessel_baseline.yaml::own_radar.exposed_positions); bays, hangar, flight deck and stern ramp are not exposed."
    provenance: "ASSUMED"
    justification: "No official layout gives antenna geometry; the radar sits on the mast, so mast and roof positions share its field. Replace with the real geometry when available."
    code_references:
      - "src/sdv_governor/capability_effects.py::effective_capability_retention"
      - "src/sdv_governor/manifest.py::validate_ship_profile"
    test: "tests/unit/test_ch_c6_own_radar.py"

  - id: D2_SCARCITY_WEIGHTS
    parameter: "Scarcity weight of each position slot in the D2 objective D2_LEXICOGRAPHIC_V2"
    unit: "dimensionless weight"
    concretized_values: "mast_1/2/3 = 3; hangar_roof, bay1, bay2, flight_deck, stern_ramp = 2; bay1_a, bay1_b, hangar = 1; rack = 0. Plan B (owner gate F6-G unavailable): scarcity is the 4th key component (after roof_cond_rank, pref_penalty, retention), so it only breaks ties and official placements are unchanged."
    provenance: "ASSUMED"
    justification: "The brief (A.3) calls the mast the scarcest resource aboard; the numeric weights are ours. Margin bucket (0.5%) is DERIVED from the eight-class budget snapshot."
    code_references:
      - "src/sdv_governor/placement.py::D2_SCARCITY_WEIGHTS"
      - "src/sdv_governor/placement.py::find_feasible_placement"
    test: "tests/unit/test_ch_c4_placement_alternatives.py"

  - id: QUIET_RADIO_MIN_CREW
    parameter: "Minimum crew aboard to accept QUIET_RADIO (radar off)"
    unit: "crew"
    concretized_values: "6 (REDUCED_CREW_6 regime); below it QUIET_RADIO is rejected with a witness and the radar is treated as transmitting."
    provenance: "ASSUMED"
    justification: "Silencing the radar removes collision-avoidance sensing; it needs a bridge watch with visual lookout and AIS."
    code_references:
      - "src/sdv_governor/capability_effects.py::check_own_radar_policy"
      - "src/sdv_governor/server.py::handle_api_request"
    test: "tests/unit/test_ch_c6_own_radar.py"
