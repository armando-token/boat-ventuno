<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="SDV Resource Governor — Deterministic 8-Class Physical Resource Governor for the Fincantieri Software-Defined Vessel Challenge">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D19" />
      <stop offset="48%" stop-color="#0B1629" />
      <stop offset="100%" stop-color="#0F1F38" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="18%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070D19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shipGlow" cx="78%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070D19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#1E40AF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0F2942" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="14" fill="url(#grid)" />
  <rect width="1200" height="380" rx="14" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" rx="14" fill="url(#shipGlow)" />
  <rect x="1" y="1" width="1198" height="378" rx="13" fill="none" stroke="#1E3A5F" stroke-width="1.5" />

  <!-- Top Telemetry Header Strip -->
  <g transform="translate(44, 28)">
    <rect x="0" y="0" width="328" height="24" rx="12" fill="#0C223B" stroke="#0284C7" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10B981" />
    <text x="26" y="16" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.8">FINCANTIERI SDV CHALLENGE · SF 2026</text>

    <rect x="340" y="0" width="218" height="24" rx="12" fill="#0B2727" stroke="#10B981" stroke-width="1" />
    <text x="354" y="16" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.6">ARDUINO VENTUNO Q · AARCH64</text>
  </g>

  <!-- Left Column: Title & Core Architecture -->
  <g transform="translate(44, 88)">
    <text x="0" y="0" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">SDV RESOURCE GOVERNOR</text>
    <text x="0" y="28" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Deterministic 8-Class Physical Resource Governor &amp; 3D Naval Digital Twin</text>
    <rect x="0" y="42" width="540" height="2" fill="url(#accentLine)" />

    <text x="0" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      Owns the eight Annex A budgets of the 60–70 m reference vessel and decides
    </text>
    <text x="0" y="87" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      admission (D1), placement (D2), right of way (D3) and degradation (D4), with
    </text>
    <text x="0" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      crew as a setting (D5) and every assumed number in the Physical Account (D6).
    </text>

    <!-- D1..D6 Pill Grid -->
    <g transform="translate(0, 126)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      <rect x="0" y="0" width="172" height="28" rx="6" fill="#0F243C" stroke="#0EA5E9" stroke-width="1" />
      <text x="12" y="18" fill="#38BDF8">D1 ADMISSION &lt;= 30s</text>

      <rect x="182" y="0" width="172" height="28" rx="6" fill="#0F243C" stroke="#0EA5E9" stroke-width="1" />
      <text x="194" y="18" fill="#38BDF8">D2 PLACEMENT V2</text>

      <rect x="364" y="0" width="178" height="28" rx="6" fill="#0F243C" stroke="#0EA5E9" stroke-width="1" />
      <text x="376" y="18" fill="#38BDF8">D3 RIGHT OF WAY &lt;= 2s</text>

      <rect x="0" y="36" width="172" height="28" rx="6" fill="#0F243C" stroke="#38BDF8" stroke-width="1" />
      <text x="12" y="54" fill="#7DD3FC">D4 DEGRADATION &lt;= 5s</text>

      <rect x="182" y="36" width="172" height="28" rx="6" fill="#0F243C" stroke="#38BDF8" stroke-width="1" />
      <text x="194" y="54" fill="#7DD3FC">D5 CREW DIAL 14/6/0</text>

      <rect x="364" y="36" width="178" height="28" rx="6" fill="#0F243C" stroke="#38BDF8" stroke-width="1" />
      <text x="376" y="54" fill="#7DD3FC">D6 PHYSICAL ACCOUNT</text>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(0, 214)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="542" height="36" rx="8" fill="#091323" stroke="#1E3A5F" stroke-width="1" />
      <text x="14" y="22" fill="#10B981" font-weight="700">✓ 300+ tests pass</text>
      <text x="142" y="22" fill="#475569">|</text>
      <text x="156" y="22" fill="#38BDF8" font-weight="700">✓ 37/37 Mutations Rejected</text>
      <text x="342" y="22" fill="#475569">|</text>
      <text x="356" y="22" fill="#F59E0B" font-weight="700">⚡ Safety &lt; 1 ms · p99 2.42 ms</text>
    </g>
  </g>

  <!-- Right Column: 60-70m Vessel Digital Twin Schematic Card -->
  <g transform="translate(616, 28)">
    <rect x="0" y="0" width="540" height="324" rx="12" fill="#081221" fill-opacity="0.9" stroke="#1E3A5F" stroke-width="1.5" />
    <text x="20" y="28" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.8">60–70 M REFERENCE VESSEL · SCENARIO B (G1 + G3 + G4 + G5)</text>
    <circle cx="514" cy="24" r="4" fill="#00F0FF" />

    <!-- Waterline & Sea Surface -->
    <line x1="20" y1="192" x2="520" y2="192" stroke="#0284C7" stroke-width="1" stroke-dasharray="5,4" />
    <text x="20" y="218" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">SST 16.3°C · C(T) 150.4 kW</text>

    <!-- Ship Hull Silhouette -->
    <path d="M 48 184 L 78 202 L 452 202 L 502 162 L 380 162 L 368 144 L 160 144 L 146 162 L 48 162 Z" fill="url(#hullGrad)" stroke="#38BDF8" stroke-width="1.6" />

    <!-- Superstructure & Bridge -->
    <path d="M 310 144 L 325 104 L 412 104 L 426 144 Z" fill="#132A4A" stroke="#60A5FA" stroke-width="1.3" />
    <!-- Mast 3 -->
    <line x1="368" y1="104" x2="368" y2="58" stroke="#38BDF8" stroke-width="2.2" />
    <line x1="352" y1="72" x2="384" y2="72" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="368" cy="56" r="4.5" fill="#00F0FF" />

    <!-- Mast 3 Callout (G1) -->
    <rect x="382" y="44" width="136" height="32" rx="5" fill="#0C223B" stroke="#00F0FF" stroke-width="1" />
    <text x="390" y="58" fill="#00F0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">MAST_3 · G1 METEO</text>
    <text x="390" y="70" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">45 kg · 1.5 kW Air</text>

    <!-- Hangar & Hangar Roof (G4 Station + G5 Antenna) -->
    <rect x="206" y="112" width="96" height="32" rx="3" fill="#162E52" stroke="#38BDF8" stroke-width="1.3" />
    <circle cx="254" cy="105" r="4" fill="#F59E0B" />
    <rect x="172" y="56" width="162" height="34" rx="5" fill="#1F242D" stroke="#F59E0B" stroke-width="1" />
    <text x="180" y="70" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">HANGAR ROOF · G5 ANT</text>
    <text x="180" y="82" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">25 kg (1.2x) · 1.2 kW Air</text>

    <!-- Flight Deck (G4 Drone) -->
    <rect x="74" y="152" width="118" height="10" rx="2" fill="#0EA5E9" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1" />
    <rect x="26" y="102" width="136" height="34" rx="5" fill="#0C223B" stroke="#38BDF8" stroke-width="1" />
    <text x="34" y="116" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">FLIGHT DECK · G4 UAV</text>
    <text x="34" y="128" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5">990 kg · 10→35 kW</text>

    <!-- Bay 2 (G5 Container) & Bay 1 (G3 AUV) -->
    <rect x="200" y="166" width="76" height="24" rx="3" fill="#0F2942" stroke="#60A5FA" stroke-width="1.2" />
    <text x="208" y="181" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700">BAY 2: G5</text>

    <rect x="286" y="166" width="76" height="24" rx="3" fill="#0F2942" stroke="#34D399" stroke-width="1.2" />
    <text x="294" y="181" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700">BAY 1: G3</text>

    <!-- Bottom 8-Class Budget Gauges inside Card -->
    <g transform="translate(20, 222)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- Power Gauge -->
      <rect x="0" y="0" width="160" height="82" rx="6" fill="#0B192E" stroke="#1E3A5F" stroke-width="1" />
      <text x="10" y="18" fill="#94A3B8" font-size="9.5" font-weight="700">POWER (GENSET LOSS)</text>
      <text x="10" y="38" fill="#38BDF8" font-size="14" font-weight="800">69.5 / 100.0 kW</text>
      <rect x="10" y="48" width="140" height="7" rx="3.5" fill="#1E293B" />
      <rect x="10" y="48" width="97" height="7" rx="3.5" fill="#0EA5E9" />
      <text x="10" y="70" fill="#64748B" font-size="8.5">106.5→69.5 kW (G5 step-down)</text>

      <!-- Cooling Gauge -->
      <rect x="170" y="0" width="160" height="82" rx="6" fill="#0B192E" stroke="#1E3A5F" stroke-width="1" />
      <text x="180" y="18" fill="#94A3B8" font-size="9.5" font-weight="700">CHILLED WATER + AIR</text>
      <text x="180" y="38" fill="#34D399" font-size="14" font-weight="800">67.5 / 72.0 kW</text>
      <rect x="180" y="48" width="140" height="7" rx="3.5" fill="#1E293B" />
      <rect x="180" y="48" width="130" height="7" rx="3.5" fill="#10B981" />
      <text x="180" y="70" fill="#64748B" font-size="8.5">30°C -40% loop · Air 2.7 kW</text>

      <!-- Mass & Stability Gauge -->
      <rect x="340" y="0" width="160" height="82" rx="6" fill="#0B192E" stroke="#1E3A5F" stroke-width="1" />
      <text x="350" y="18" fill="#94A3B8" font-size="9.5" font-weight="700">MASS &amp; STABILITY</text>
      <text x="350" y="38" fill="#FBBF24" font-size="14" font-weight="800">9,560 / 10,000 kg</text>
      <rect x="350" y="48" width="140" height="7" rx="3.5" fill="#1E293B" />
      <rect x="350" y="48" width="133" height="7" rx="3.5" fill="#F59E0B" />
      <text x="350" y="70" fill="#64748B" font-size="8.5">Stab: 9,853 / 12,000 kg-eq</text>
    </g>
  </g>
</svg>
