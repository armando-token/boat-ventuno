installation:
  port_only: true
  min_crew_required: 4
  install_time_min: 360
  remove_time_min: 360
  sea_install_max_wind_kn: 0
  sea_install_min_speed_kn: 0.0
  sea_install_max_speed_kn: 0.0

vehicle_replacement:
  supported_at_sea: false
  min_crew_required: 4
  swap_duration_min: 45
  min_speed_kn: 0.0
  max_speed_kn: 5.0
  max_wind_kn: 18
  max_sea_state: 3

ship_state_constraints:
  min_speed_kn_for_operation: 0.0
  max_speed_kn_for_operation: 5.0
  max_wind_kn_for_operation: 22
  max_sea_state_for_operation: 4
  requires_heading_into_wind_for_launch_recovery: false
  forbids_deck_machinery_while_active: false
  uses_deck_machinery: true
  requires_stern_ramp_free: false
  acoustic_hold_handshake_min_s: 0
  acoustic_hold_handshake_max_s: 0
  acoustic_hold_default_s: 0
  low_battery_threshold_pct: null
  emergency_landing_deadline_s: null
  max_flight_endurance_min: null

dependencies:
  requires_guests: []
  excludes_guests: []
  conditional_excludes:
    - other_guest_id: "G3"
      when_self_modes: ["INSPECTION_ACTIVE"]
      when_other_modes: ["SURVEY_QUIET"]
      reason: "G2 winch is deck machinery and is excluded while G3 listens in quiet acoustic survey"
    - other_guest_id: "G4"
      when_self_modes: ["INSPECTION_ACTIVE"]
      when_other_modes: ["LAUNCH_RECOVERY_OPTICS", "RECOVERY_APPROACH"]
      reason: "G2 winch operation is excluded while G4 recovers on flight deck"

mission_capabilities:
  hydrographic_survey: 85.0
  water_quality_monitoring: 85.0
  environmental_sensing: 75.0
  subsea_intervention: 55.0
  hull_and_cable_inspection: 55.0
  salvage_assistance: 50.0
