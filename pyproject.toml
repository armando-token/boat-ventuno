[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdv-resource-governor"
version = "1.1.0"
description = "Deterministic Eight-Class Resource Governor for Software-Defined Vessel (SDV)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - Hackathon Evaluation Only (All Rights Reserved)"}
authors = [
  {name = "Armando Silva"},
  {name = "Antigravity Assistant (Declared AI Use)"}
]
dependencies = [
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
validation = [
  "jsonschema>=4.10.0",
]
dev = [
  "pytest>=8.0.0",
  "jsonschema>=4.10.0",
]

[project.scripts]
sdv-governor = "sdv_governor.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdv_governor*"]

[tool.setuptools.package-data]
"*" = [
  "_bundled/**/*",
  "_bundled/*",
  "_bundled/data/**/*",
  "_bundled/schemas/*",
  "_bundled/ui/**/*",
  "_bundled/viz3d/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "perf: performance and latency budget verification tests (PERF-01..06)",
    "board: touches the remote Linux board over SSH (enable with --run-board or SDV_RUN_BOARD=1)",
    "release_local: needs local gitignored release artefacts (FINAL_STATUS.md, CLOSURE_STATUS_V2.json)",
]
