  min_crew_required: 4
  install_time_min: 240
  remove_time_min: 240
  sea_install_max_wind_kn: 0
  sea_install_min_speed_kn: 0.0
  sea_install_max_speed_kn: 0.0

vehicle_replacement:
  supported_at_sea: true
  min_crew_required: 3
  swap_duration_min: 30
  min_speed_kn: 4.0
  max_speed_kn: 8.0
  max_wind_kn: 20
  max_sea_state: 3

ship_state_constraints:
  min_speed_kn_for_operation: 5.0
  max_speed_kn_for_operation: 12.0
  max_wind_kn_for_operation: 25
  max_sea_state_for_operation: 4
  requires_heading_into_wind_for_launch_recovery: true
  forbids_deck_machinery_while_active: false
