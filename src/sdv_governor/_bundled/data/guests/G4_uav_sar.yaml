  acoustic_hold_default_s: 0
  low_battery_threshold_pct: 20.0
  emergency_landing_deadline_s: 720
  max_flight_endurance_min: 90

dependencies:
  requires_guests: []
  excludes_guests: []
  conditional_excludes:
    - other_guest_id: "G3"
      when_self_modes: ["LAUNCH_RECOVERY_OPTICS", "RECOVERY_APPROACH"]
      when_other_modes: ["SURVEY_QUIET"]
      reason: "G4 recovery requires turning into wind at 5-12 kn and active flight-deck machinery, which breaks G3 3-kn quiet acoustic survey"
    - other_guest_id: "G2"
      when_self_modes: ["LAUNCH_RECOVERY_OPTICS", "RECOVERY_APPROACH"]
      when_other_modes: ["INSPECTION_ACTIVE"]
      reason: "G4 launch/recovery requires clear deck and excludes concurrent G2 winch operation"

mission_capabilities:
