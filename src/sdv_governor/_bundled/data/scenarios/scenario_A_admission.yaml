  vessel_mode: "PORT_OPS"
  ship_speed_kn: 0
  wind_kn: 10
  sea_state: 1
  seawater_temp_c: 16.0
  crew_count: 14
  deck_clear: true
  power_reserve_w: 200000
  cooling_loop_degraded: false
  installed_guests:
    - guest_id: "G3"
      mode: "SURVEY_QUIET"
      placements:
        G3_AUV_CRADLE_BAY1_20FT: "bay1"
      compute_node: "node_1"
    - guest_id: "G4"
      mode: "FLIGHT_PATROL"
      placements:
        G4_DRONE_VEHICLE: "hangar"
        G4_HANGAR_STATION: "hangar"
