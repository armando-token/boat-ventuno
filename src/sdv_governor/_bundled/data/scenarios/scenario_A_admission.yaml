schema_version: "sdv-scenario/1.0"
scenario_id: "SCENARIO_A_ADMISSION"
name: "Scenario A — D1 Guest Card Admission & Placement Over 14-Day Mission Envelope"
scenario_class: "OFFICIAL_CHALLENGE"
seed: 20261016
initial_state:
