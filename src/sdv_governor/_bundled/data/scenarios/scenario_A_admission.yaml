    allow_displacement: false
    description: "Evaluate admitting G6 when G3 (Bay1) and G4 (Hangar) are installed and Bay2 is free -> YES across 14-day envelope."
  - seq: 3
    sim_time_s: 20
    priority: 10
    event_type: "EVALUATE_ADMISSION_WITH_BASELINE"
    installed_guest_ids: ["G3", "G4"]
    candidate_guest_id: "G1"
    allow_displacement: false
    description: "Evaluate admitting G1 when mast_3 is free -> YES across 14-day envelope."
