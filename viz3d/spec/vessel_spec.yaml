  bay1_20ft_envelope: [10.2, 16.3]
  hangar_superstructure_aft: [16.8, 25.5]
  funnel_stack_casing: [23.0, 28.5]
  midships_boat_recess_and_bay2: [25.5, 34.0]
  bridge_superstructure: [32.0, 44.5]
  integrated_mast_tower: [34.2, 38.0]
  foredeck_sar_mount: [45.5, 50.2]
