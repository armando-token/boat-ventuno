# viz3d/spec/vessel_spec.yaml
# Escala 1:1 (1 unidad 3D = 1.0 metro SI)
# Trazabilidad estricta: OFFICIAL_BRIEF (Anexo A/B), BLUEPRINT_MEASURED (12.416 px/m sobre plano 60m),
# ORGANIZER_ERRATA (G4 = 140 + 850 = 990 kg), o ASSUMED (proporciones hidrostáticas OPV 60m).

schema_version: "sdv-viz3d-vessel-spec/1.0"
vessel_id: "SDV_FINCANTIERI_DUAL_USE_60M"
vessel_name: "SDV 60m Multi-Role Dual-Use Offshore Vessel"

coordinate_frame:
  origin: "Aft Perpendicular (AP) at Baseline (keel z=0, centerline y=0)"
  x_axis: "Longitudinal (+X forward from AP=0.0m to FP=60.0m; rendered centered at X=[-30.0, +30.0])"
  y_axis: "Vertical (+Y up from Baseline=0.0m; Design Waterline WL at Y=+3.20m)"
  z_axis: "Transverse (+Z starboard, -Z port; Beam B=11.0m -> Z in [-5.50, +5.50])"
  scale_calibration_px_per_m: 12.416

principal_dimensions:
  loa_m:
    value: 60.0
    origin: "OFFICIAL_BRIEF_AND_BLUEPRINT"
  lwl_m:
    value: 56.2
    origin: "BLUEPRINT_MEASURED"
  beam_molded_m:
    value: 11.0
    origin: "ASSUMED"
    justification: "Standard 60m OPV/MPV beam (10.5-11.2m) required to accommodate 12x8m stern flight deck and side passages."
  depth_main_deck_m:
    value: 5.8
    origin: "BLUEPRINT_MEASURED"
    justification: "Blueprint vertical cota '6m' to main working deck / 8m to upper forecastle deck."
  depth_forecastle_deck_m:
    value: 8.0
    origin: "BLUEPRINT_MEASURED"
  draft_design_m:
    value: 3.2
    origin: "ASSUMED"
    justification: "Hull baseline to waterline in blueprint (~2.6-3.5m class range); pods extend to -5.1m."
  block_coefficient_cb:
    value: 0.485
    origin: "ASSUMED"
  waterplane_coefficient_cwp:
    value: 0.78
    origin: "ASSUMED"
  displacement_tonnes:
    value: 984.0
    origin: "DERIVED"
    formula: "LWL * B * T * Cb * 1.025"
  tpc_tonnes_per_cm:
    value: 4.94
    origin: "DERIVED"
    formula: "(LWL * B * Cwp * 1.025) / 100"
  gm_transverse_m:
    value: 1.28
    origin: "ASSUMED"
  mast_top_height_above_wl_m:
    value: 20.4
    origin: "BLUEPRINT_MEASURED"

